# Proxima Sim — Faction starting defaults per ethos.
#
# Any ship departing has factions present from day 0. This file declares the default
# faction breakdown for each ethos. Player can override at the social-stage of the
# picker. The factions system reads this at initialization and then evolves the
# factions over the voyage (drift, schism, merge).
#
# Schema:
#   <ethos_id>:
#     factions:
#       - id: stable slug
#         name: human-readable
#         share: 0..1 of population (must sum ~1.0 across factions)
#         intensity: 0..1 — how strongly members identify
#         religious_alignment: id from religions registry, or null
#         political_lean: -1 (collectivist) .. +1 (individualist)
#         class_tier: 0..1 — economic/labor tier within ship
#         alienation_baseline: 0..1 — how much this faction feels distinct from the whole
#     initial_tension_matrix:  # pairwise tension 0..1; 0 = harmony, 1 = hostile
#       <faction_a>:
#         <faction_b>: <tension>

version: 1

defaults:

  mixed_voluntary:
    factions:
      - {id: technical_class, name: "Technical class", share: 0.40, intensity: 0.45, political_lean: 0.10, class_tier: 0.65, alienation_baseline: 0.10}
      - {id: working_class, name: "Working class", share: 0.40, intensity: 0.40, political_lean: -0.20, class_tier: 0.40, alienation_baseline: 0.20, religious_alignment: "ecumenical_practitioners"}
      - {id: leadership, name: "Leadership cadre", share: 0.10, intensity: 0.65, political_lean: 0.20, class_tier: 0.85, alienation_baseline: 0.05}
      - {id: youth, name: "Ship-born youth", share: 0.05, intensity: 0.30, political_lean: 0.0, class_tier: 0.45, alienation_baseline: 0.15}
      - {id: latent_religious, name: "Latent religious minority", share: 0.05, intensity: 0.55, political_lean: -0.10, class_tier: 0.40, alienation_baseline: 0.30, religious_alignment: "syncretic_revival"}
    initial_tension_matrix:
      technical_class: {working_class: 0.20, leadership: 0.15, youth: 0.10}
      working_class:   {technical_class: 0.20, leadership: 0.30, youth: 0.05}
      leadership:      {technical_class: 0.15, working_class: 0.30, youth: 0.10}
      youth:           {technical_class: 0.10, working_class: 0.05, leadership: 0.10}

  mission_scientists:
