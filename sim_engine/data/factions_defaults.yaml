      - {id: technical_support, name: "Technical support", share: 0.28, intensity: 0.40, political_lean: -0.05, class_tier: 0.45, alienation_baseline: 0.20, religious_alignment: "personal_faith"}
      - {id: command, name: "Mission command", share: 0.10, intensity: 0.75, political_lean: 0.20, class_tier: 0.90, alienation_baseline: 0.10}
