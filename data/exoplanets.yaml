# Proxima Sim — Curated Exoplanet Catalogue
#
# Hand-picked from NASA Exoplanet Archive entries with peer-reviewed confirmations,
# focusing on habitable-zone candidates and named flagship targets within ~200 ly.
#
# Distances and parameters reflect best-published values as of 2024-2026 NASA Exoplanet
# Archive snapshots and Habitable Exoplanets Catalog (HEC) updates. Where there's a range,
# the median value is given; the `confidence` field flags how well-characterized the
# planet's habitability is.
#
# Earth Similarity Index (ESI): 0-1 scale combining radius, density, escape velocity,
# and surface temperature versus Earth. ESI >= 0.8 = strong Earth analog.
#
# Schema:
#   id: stable slug
#   name: official designation
#   host_star: stellar host
#   star_type: spectral class
#   distance_ly: distance from Earth in light-years
#   radius_earth: planet radius in Earth radii
#   mass_earth: planet mass in Earth masses (estimated when not measured)
#   eq_temp_k: equilibrium temperature in Kelvin (no atmosphere model)
#   insolation: starlight flux relative to Earth (Earth = 1.0)
#   esi: Earth Similarity Index
#   discovered: discovery year
#   habitability_tier: confirmed | strong_candidate | marginal | speculative
#   tidal_locked: true/false (with confidence flag)
#   notes: real caveats
#
# Tier definitions for the picker:
#   approach: 4-8 ly  (close — single-generation voyages possible at 0.05c)
#   reach: 8-20 ly    (medium — multi-generational at most plausible speeds)
#   push: 20-50 ly    (far — many-generation commitment)
#   hail_mary: 50-200 ly (extreme — civilization-scale)

version: 1

exoplanets:

