- id: proxima_b
  name: Proxima Centauri b
  host_star: Proxima Centauri
  star_type: M5.5V (red dwarf)
  distance_ly: 4.24
  radius_earth: 1.07
  mass_earth: 1.07
  eq_temp_k: 234
  insolation: 0.65
  esi: 0.87
  discovered: 2016
  habitability_tier: strong_candidate
  tidal_locked: true
  hazards:
    - "Frequent stellar flares from Proxima — radiation events"
    - "Tidal locking — half-planet permanent night"
    - "Atmosphere unconfirmed; could be stripped by flares"
  notes: |
    The closest exoplanet beyond our solar system. Discovered via radial velocity by ESO HARPS.
    Sister-planet Proxima d (smaller, hotter) confirmed 2022. Proxima Centauri itself is part
    of Alpha Centauri system, gravitationally bound to A and B (Sun-like stars).

