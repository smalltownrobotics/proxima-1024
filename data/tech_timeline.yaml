  notes: |
    Aneutronic — much less neutron damage. Requires He-3 supply (lunar/gas-giant). Preferred
    for interstellar drive. Real bottleneck is fuel supply, not reactor physics.
  prereq: [power_fusion_dt, mining_he3]

