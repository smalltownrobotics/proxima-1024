# Proxima Sim — Technology Availability Timeline
#
# Each technology has three projection years: pessimistic, likely, optimistic.
# At runtime, the sim checks the chosen launch year against these:
#   year < pessimistic        → tech unavailable; mission infeasible if required
#   pessimistic <= year < likely → tech experimental; reliability_multiplier ~0.55 (high failure)
#   likely <= year < optimistic  → tech mature; reliability_multiplier ~0.85 (typical drama)
#   optimistic <= year < mature  → tech proven; reliability_multiplier ~0.95
#   mature <= year             → reliability_multiplier 1.0 (failures are tail-risk only)
#
# Sources are real published designs, peer-reviewed papers, BIS/AIAA conference proposals,
# NASA TM reports. Speculative items are marked. Year ranges reflect honest engineering
# uncertainty, not hand-wave.
#
# Schema:
#   id: stable slug
#   name: human-readable
#   category: propulsion | life_support | structural | power | cryogenics | shielding |
#             computing | hydroponics | medical
#   pessimistic_year: earliest plausible engineering availability (research-prototype level)
#   likely_year: typical projection by mainstream forecasters
#   optimistic_year: well-funded mature operational reality
#   mature_year: ubiquitous, cheap, off-the-shelf
#   sources: list of citations
#   notes: caveats, failure modes, real constraints
#   prereq: list of tech ids that must also be available (transitive)
#
# Curation date: 2026-04-27. Living document. Update as published roadmaps shift.

version: 1

technologies:

# =================================================================
# PROPULSION
# =================================================================

- id: prop_chemical
  name: Chemical rocket (LOX/LH2 / methalox)
  category: propulsion
  pessimistic_year: 1957
  likely_year: 1965
  optimistic_year: 1970
  mature_year: 1980
  sources:
    - "Saturn V (Apollo, 1969)"
    - "SpaceX Raptor / Starship Methalox (operational 2024)"
  notes: |
    Delta-v ceiling ~10 km/s for cargo, ~14 km/s with multistage. Cannot reach interstellar
    speeds (need 0.001c+ = 300 km/s). Useful only for Earth-orbit assembly and final braking
    in destination system. NOT a generational-ship propulsion option, ever.
  prereq: []

- id: prop_ion_electric
  name: Ion / Hall-effect electric thrusters
  category: propulsion
  pessimistic_year: 1998
  likely_year: 2005
  optimistic_year: 2015
  mature_year: 2025
  sources:
    - "NASA Deep Space 1 (1998, NSTAR thruster)"
    - "Dawn (2007, ion-propelled to Vesta and Ceres)"
    - "BepiColombo (2018+, T6 ion thrusters)"
  notes: |
    Specific impulse 3000-9000 s. Thrust is tiny (~mN); needs years to reach high delta-v.
    Practical for unmanned interplanetary, not interstellar within human lifetime.
  prereq: [prop_chemical]

- id: prop_nuclear_thermal
  name: Nuclear-thermal rocket (NTR)
  category: propulsion
  pessimistic_year: 2030
  likely_year: 2045
  optimistic_year: 2060
  mature_year: 2080
  sources:
    - "NASA NERVA program (1955-1972, ground tested, never flown)"
    - "DRACO / DARPA-NASA (active 2024, in-space demo target ~2027)"
  notes: |
    Specific impulse ~900 s, ~2x chemical. Doubles delta-v; still not interstellar. Useful
    for fast cargo within solar system. Treated as enabling tech for orbital assembly of
    larger interstellar craft, not the propulsion of the craft itself.
  prereq: [prop_chemical]

- id: prop_nuclear_electric
  name: Nuclear-electric (NEP) — fission reactor + electric thrusters
  category: propulsion
  pessimistic_year: 2080
  likely_year: 2140
  optimistic_year: 2200
  mature_year: 2280
  sources:
    - "Project Prometheus (NASA, 2003-2005, cancelled)"
    - "Multiple post-2020 SBIR studies"
  notes: |
    Reactor in 100s of kW class powers ion/Hall thrusters. Continuous low thrust over years.
    Could reach 0.001c-0.005c interstellar cruise speeds (300-1500 km/s). Voyage to Proxima
    ~800-4000 years. Generational scale only. Real constraint: reactor longevity over a
    century-plus.
  prereq: [prop_ion_electric, power_fission_reactor]

- id: prop_solar_sail
  name: Solar / laser sail (close-Sun deployment)
  category: propulsion
  pessimistic_year: 2030
  likely_year: 2050
  optimistic_year: 2080
  mature_year: 2120
  sources:
    - "IKAROS (JAXA, 2010, first interplanetary solar sail)"
    - "LightSail 2 (Planetary Society, 2019)"
    - "Project Forward 1984 (Robert Forward, laser-sail interstellar concept)"
    - "Breakthrough Starshot (2016+, 0.2c lightsail concept)"
  notes: |
    Solar sails: ~0.001c-0.01c achievable for small craft using close-Sun perihelion.
    Laser sails: theoretically up to ~0.2c for gram-scale probes (Starshot). Generational
    ships: not viable as primary — sails can't be scaled to 50,000-ton ships without
    impossible laser arrays. Useful as auxiliary thrust or for unmanned scout swarms.
  prereq: [structural_carbon_composite]

- id: prop_fusion_pulse_daedalus
  name: Fusion-pulse (Daedalus / Project Icarus class)
  category: propulsion
  pessimistic_year: 2080
  likely_year: 2120
  optimistic_year: 2150
  mature_year: 2200
  sources:
    - "Project Daedalus (BIS, 1978) — D/He-3 fusion-pulse, 0.12c, 50,000 tons"
    - "Project Icarus (2009-, modernized Daedalus)"
    - "VARIES / Friedwardt Winterberg fusion drive proposals"
  notes: |
    Cruise speeds 0.05c-0.12c plausible. Voyage to Proxima 35-85 years — fast enough that
    crews can survive without strict cryo-rotation. Hard requirements: He-3 fuel (lunar
    mining or gas-giant skim), 50,000+ ton orbital assembly, fusion ignition reliability
    over decades. Real bottleneck: He-3 supply infrastructure.
  prereq: [power_fusion_dt, structural_carbon_composite, mining_he3]

- id: prop_fusion_continuous
  name: Continuous fusion drive (D-He3 magnetic confinement)
  category: propulsion
  pessimistic_year: 2100
  likely_year: 2140
  optimistic_year: 2170
  mature_year: 2230
  sources:
    - "Bussard polywell concepts"
    - "Princeton FRC (Field-Reversed Configuration) reactor research"
    - "Eric Lerner focus fusion (speculative timeline)"
  notes: |
    Continuous thrust for years; smoother than pulse, fewer ignition events. Cruise 0.05-0.15c.
    Speculative but better than pulse if the engineering matures. Not before 2100 honestly.
  prereq: [power_fusion_dhe3, structural_carbon_nanotube]

- id: prop_magsail_braking
  name: Magnetic-sail braking (interstellar medium / destination star)
  category: propulsion
  pessimistic_year: 2090
  likely_year: 2130
  optimistic_year: 2160
  mature_year: 2210
  sources:
    - "Robert Zubrin & Dana Andrews (1990s), Magsail concept"
    - "Multiple modernizations 2010+"
  notes: |
    Decelerates a fast craft using interstellar plasma drag — critical for fusion-pulse
    missions which can't carry symmetric braking fuel. Without magsail, fast missions fly
    past their destination at 0.1c. Required pair tech for prop_fusion_pulse_daedalus.
  prereq: [prop_fusion_pulse_daedalus]

- id: prop_beam_rider
  name: Beam-rider (Earth/lunar laser array → interstellar craft)
  category: propulsion
  pessimistic_year: 2120
  likely_year: 2170
  optimistic_year: 2220
  mature_year: 2300
  sources:
    - "Robert Forward, 'Roundtrip Interstellar Travel Using Laser-Pushed Lightsails' (1984)"
    - "Breakthrough Starshot scaled-up variants"
    - "Philip Lubin (UCSB) directed-energy research"
  notes: |
    Earth-side gigawatt-to-petawatt laser pushes lightsail-equipped craft. No fuel mass on
    the craft itself. Cruise speeds 0.1-0.3c possible. Catch: needs an Earth-system laser
    array on the order of a small moon. Civilizational-scale infrastructure project.
    Generational ships face a deceleration problem (no return beam at destination).
  prereq: [structural_carbon_nanotube, power_solar_orbital_gigawatt]

- id: prop_mass_driver
  name: Mass-driver (kinetic-impactor cargo, sometimes proposed for crewed)
  category: propulsion
  pessimistic_year: 2080
  likely_year: 2110
  optimistic_year: 2150
  mature_year: 2200
  sources:
    - "Gerard K. O'Neill, 'The High Frontier' (1976), lunar mass-driver"
    - "Various 1980s-2010s solar-system mass-driver studies"
  notes: |
    Lunar/asteroid-based magnetic-acceleration launch tracks. Useful for boosting fast
    interstellar probes or pushing kinetic interceptors. Direct-drive of a generational ship
    is implausible (g-loading kills crew). Categorize as enabler, not primary propulsion.
  prereq: [power_fusion_dt]

- id: prop_antimatter_catalyzed
  name: Antimatter-catalyzed fission/fusion (ICAN-II class)
  category: propulsion
  pessimistic_year: 2150
  likely_year: 2200
  optimistic_year: 2250
  mature_year: 2350
  sources:
    - "Penn State ICAN-II proposals (1999-2000)"
    - "Gerald Smith antimatter-catalyzed fusion concepts"
  notes: |
    Tiny amounts of antimatter (~µg) catalyze fusion reactions, drastically reducing fuel
    mass. Real bottleneck: producing and storing antimatter at scales above nanograms (we
    are stuck at ~picograms today). Production-rate growth is slow.
  prereq: [power_antimatter_production_microgram]

- id: prop_antimatter_pure
  name: Pure antimatter-pilot (matter-antimatter annihilation drive)
  category: propulsion
  pessimistic_year: 2250
  likely_year: 2350
  optimistic_year: 2450
  mature_year: 2600
  sources:
    - "Frisbee, AIAA-2003-4696, 'How to Build an Antimatter Rocket for Interstellar Missions'"
  notes: |
    Specific impulse 10^7 s. Cruise 0.3-0.5c. Civilizational-scale antimatter production
    required (kilograms). Treat as far-future; many runs will not have this option even at
    optimistic timing.
  prereq: [power_antimatter_production_kilogram]

