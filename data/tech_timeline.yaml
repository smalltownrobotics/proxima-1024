- id: power_fusion_dt
  name: D-T fusion reactor (deuterium-tritium)
  category: power
  pessimistic_year: 2055
  likely_year: 2080
  optimistic_year: 2110
  mature_year: 2150
  sources:
    - "ITER (first plasma 2025-2030 target, Q>1 milestones 2035-2040)"
    - "Commonwealth Fusion Systems SPARC (2025-2027 commissioning target)"
  notes: |
    Mainstream-likely fusion. Requires tritium breeding (limited resource). Less useful for
    interstellar than D/He-3 because of neutron flux damage to ship structure.
  prereq: [power_fission_reactor]

- id: power_fusion_dhe3
  name: D-He3 fusion reactor (aneutronic)
  category: power
  pessimistic_year: 2080
  likely_year: 2120
  optimistic_year: 2150
  mature_year: 2200
